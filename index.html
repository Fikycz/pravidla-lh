<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test z pravidel a situací IIHF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- Header -->
    <header class="max-w-2xl w-full mx-auto flex justify-between items-center py-4 border-b border-slate-700">
        <h1 class="text-xl font-bold tracking-wide text-blue-400">Rozhodčí Litvínov</h1>
        <div id="score-tracker" class="text-sm font-semibold bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
            Postup: <span id="progress-text" class="text-blue-400">0 / 0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full mx-auto my-auto bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
        
        <!-- 1. HLAVNÍ MENU -->
        <div id="menu-card" class="space-y-4 text-center">
            <h2 class="text-xl font-bold text-slate-100 mb-2">Vyberte délku testu</h2>
            <div class="grid gap-3">
                <button onclick="startQuiz(10)" class="w-full bg-slate-700 hover:bg-slate-600 p-3.5 rounded-lg border border-slate-600 text-left flex justify-between items-center font-medium transition">
                    <span>Rychlý test</span>
                    <span class="text-xs bg-blue-600 px-2.5 py-1 rounded font-bold text-white">10 otázek</span>
                </button>
                <button onclick="startQuiz(20)" class="w-full bg-slate-700 hover:bg-slate-600 p-3.5 rounded-lg border border-slate-600 text-left flex justify-between items-center font-medium transition">
                    <span>Střední test</span>
                    <span class="text-xs bg-blue-600 px-2.5 py-1 rounded font-bold text-white">20 otázek</span>
                </button>
                <button onclick="startQuiz(9999)" class="w-full bg-slate-700 hover:bg-slate-600 p-3.5 rounded-lg border border-slate-600 text-left flex justify-between items-center font-medium transition">
                    <span>Kompletní test</span>
                    <span id="max-questions-badge" class="text-xs bg-emerald-600 px-2.5 py-1 rounded font-bold text-white">Všechny</span>
                </button>
            </div>
            <div id="status-msg" class="text-xs text-slate-400 pt-2">Načítání otázek z questions.json...</div>
        </div>

        <!-- 2. PRŮBĚH TESTU -->
        <div id="quiz-card" class="hidden">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span id="rule-ref" class="font-mono bg-slate-700 px-2 py-0.5 rounded text-blue-300">Pravidlo --</span>
                <span id="situation-type" class="uppercase tracking-wider font-semibold text-slate-300">Kategorie</span>
            </div>

            <h2 id="question-text" class="text-lg font-medium text-slate-100 mb-6 leading-relaxed">
                Načítání...
            </h2>

            <div id="options-container" class="space-y-3 mb-6"></div>

            <div class="flex justify-between border-t border-slate-700 pt-4">
                <button id="prev-btn" onclick="prevQuestion()" disabled class="bg-slate-700 hover:bg-slate-600 disabled:opacity-30 px-4 py-2 rounded text-sm font-semibold transition">
                    &larr; Předchozí
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold transition">
                    Další &rarr;
                </button>
                <button id="submit-btn" onclick="finishQuiz()" class="hidden bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-semibold transition">
                    Odeslat test 🏁
                </button>
            </div>
        </div>

        <!-- 3. VÝSLEDKY & CHYBY -->
        <div id="results-card" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-100 text-center">Vyhodnocení testu</h2>
            
            <div class="bg-slate-900 p-4 rounded-lg text-center space-y-1 border border-slate-700">
                <div id="final-score" class="text-4xl font-black text-emerald-400">0 %</div>
                <p id="final-stats" class="text-sm text-slate-400">0 ze 0 správně</p>
            </div>

            <div id="review-list" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>

            <button onclick="resetMenu()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded font-semibold transition">
                Zkusit nový test
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-4">
        Založeno na Oficiálních pravidlech IIHF a IIHF Situation Book.
    </footer>

    <script>
        let rawData = [];
        let activeQuestions = [];
        let currentIndex = 0;
        let userAnswers = {};

        // Načtení externího souboru questions.json z vaší složky v GitHubu
        async function loadQuestionsFromJSON() {
            const statusEl = document.getElementById('status-msg');
            const maxBadge = document.getElementById('max-questions-badge');
            
            try {
                // Přidaný timestamp zabraňuje kešování staré verze souboru v prohlížeči
                const response = await fetch('./questions.json?v=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP chyba ${response.status}: Soubor questions.json nebyl nalezen.`);
                }
                
                rawData = await response.json();

                if (!Array.isArray(rawData) || rawData.length === 0) {
                    throw new Error('Soubor questions.json je prázdný nebo nemá správný formát.');
                }

                statusEl.textContent = `Úspěšně načteno ${rawData.length} otázek ze souboru questions.json.`;
                statusEl.className = "text-xs text-emerald-400 pt-2 font-medium";
                maxBadge.textContent = `${rawData.length} otázek`;

            } catch (error) {
                console.error("Chyba načítání:", error);
                statusEl.textContent = `Chyba načítání: ${error.message}`;
                statusEl.className = "text-xs text-rose-400 pt-2 font-medium";
            }
        }

        function startQuiz(count) {
            if (!rawData || rawData.length === 0) {
                alert("Nelze spustit test: Není načten žádný soubor questions.json.");
                return;
            }

            // Zamíchání načtených otázek ze souboru
            const shuffled = [...rawData].sort(() => Math.random() - 0.5);
            activeQuestions = shuffled.slice(0, Math.min(count, shuffled.length));
            
            userAnswers = {};
            currentIndex = 0;

            document.getElementById('menu-card').classList.add('hidden');
            document.getElementById('results-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            
            loadQuestion();
        }
        function loadQuestion() {
            const current = activeQuestions[currentIndex];
            
            document.getElementById('rule-ref').textContent = current.rule || 'Pravidlo IIHF';
            document.getElementById('situation-type').textContent = current.category || '';
            document.getElementById('question-text').textContent = current.question;
            document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${activeQuestions.length}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const isSelected = userAnswers[currentIndex] === idx;
                
                btn.className = `w-full text-left p-3.5 rounded-lg border transition flex items-center justify-between ${
                    isSelected ? 'bg-blue-600/40 border-blue-400 text-white font-semibold' : 'border-slate-700 bg-slate-700/50 hover:bg-slate-700 text-slate-200'
                }`;
                btn.onclick = () => {
                    userAnswers[currentIndex] = idx;
                    loadQuestion();
                };
                btn.innerHTML = `<span>${opt}</span>`;
                container.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = (currentIndex === 0);

            if (currentIndex === activeQuestions.length - 1) {
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('results-card').classList.remove('hidden');

            let score = 0;
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';

            activeQuestions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correctIndex;
                if (isCorrect) score++;

                const reviewBox = document.createElement('div');
                reviewBox.className = `p-3.5 rounded-lg border text-xs ${isCorrect ? 'bg-emerald-950/40 border-emerald-700' : 'bg-rose-950/40 border-rose-700'}`;
                reviewBox.innerHTML = `
                    <div class="font-bold text-slate-200 mb-1">${idx + 1}. ${q.question}</div>
                    <div class="${isCorrect ? 'text-emerald-400' : 'text-rose-400'} font-medium">Vaše odpověď: ${userAnswers[idx] !== undefined ? q.options[userAnswers[idx]] : 'Nezodpovězeno'}</div>
                    ${!isCorrect ? `<div class="text-emerald-400 font-medium mt-0.5">Správná odpověď: ${q.options[q.correctIndex]}</div>` : ''}
                    ${q.explanation ? `<div class="text-slate-400 italic mt-2 bg-slate-900/60 p-2 rounded border border-slate-800">💡 ${q.explanation}</div>` : ''}
                `;
                reviewList.appendChild(reviewBox);
            });

            const percentage = Math.round((score / activeQuestions.length) * 100);
            document.getElementById('final-score').textContent = `${percentage} %`;
            document.getElementById('final-stats').textContent = `Správně ${score} z ${activeQuestions.length} otázek`;
        }

        function resetMenu() {
            document.getElementById('results-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('menu-card').classList.remove('hidden');
        }

        // Automatické načtení při otevření stránky
        window.onload = loadQuestionsFromJSON;
    </script>
</body>
</html>
