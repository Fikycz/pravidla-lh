<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz z pravidel a situací IIHF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- Header -->
    <header class="max-w-2xl w-full mx-auto flex justify-between items-center py-4 border-b border-slate-700">
        <h1 class="text-xl font-bold tracking-wide text-blue-400">Rozhodčí Litvínov</h1>
        <div id="score-tracker" class="text-sm font-semibold bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
            Postup: <span id="progress-text" class="text-blue-400">0 / 0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full mx-auto my-auto bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
        
        <!-- 1. HLAVNÍ MENU -->
        <div id="menu-card" class="space-y-4 text-center">
            <h2 class="text-xl font-bold text-slate-100 mb-2">Vyberte délku testu</h2>
            <div class="grid gap-3">
                <button onclick="startQuiz(10)" class="w-full bg-slate-700 hover:bg-slate-600 p-3 rounded-lg border border-slate-600 text-left flex justify-between items-center font-medium">
                    <span>Rychlý test</span>
                    <span class="text-xs bg-blue-600 px-2 py-1 rounded">10 otázek</span>
                </button>
                <button onclick="startQuiz(20)" class="w-full bg-slate-700 hover:bg-slate-600 p-3 rounded-lg border border-slate-600 text-left flex justify-between items-center font-medium">
                    <span>Střední test</span>
                    <span class="text-xs bg-blue-600 px-2 py-1 rounded">20 otázek</span>
                </button>
                <button onclick="startQuiz(40)" class="w-full bg-slate-700 hover:bg-slate-600 p-3 rounded-lg border border-slate-600 text-left flex justify-between items-center font-medium">
                    <span>Dlouhý test</span>
                    <span class="text-xs bg-blue-600 px-2 py-1 rounded">40 otázek</span>
                </button>
            </div>
        </div>

        <!-- 2. PRŮBĚH TESTU -->
        <div id="quiz-card" class="hidden">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span id="rule-ref" class="font-mono bg-slate-700 px-2 py-0.5 rounded text-blue-300">Pravidlo --</span>
                <span id="situation-type" class="uppercase tracking-wider">Kategorie</span>
            </div>

            <h2 id="question-text" class="text-lg font-medium text-slate-100 mb-6 leading-relaxed">
                Načítání otázek...
            </h2>

            <div id="options-container" class="space-y-3 mb-6"></div>

            <div class="flex justify-between border-t border-slate-700 pt-4">
                <button id="prev-btn" onclick="prevQuestion()" disabled class="bg-slate-700 disabled:opacity-40 px-4 py-2 rounded text-sm font-semibold">
                    &larr; Předchozí
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold">
                    Další &rarr;
                </button>
                <button id="submit-btn" onclick="finishQuiz()" class="hidden bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-semibold">
                    Odeslat test 🏁
                </button>
            </div>
        </div>

        <!-- 3. VÝSLEDKY & KONTROLA CHYB -->
        <div id="results-card" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-100 text-center">Vyhodnocení testu</h2>
            
            <div class="bg-slate-900 p-4 rounded-lg text-center space-y-1 border border-slate-700">
                <div id="final-score" class="text-3xl font-black text-green-400">0 %</div>
                <p id="final-stats" class="text-sm text-slate-400">0 ze 0 správně</p>
            </div>

            <div id="review-list" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>

            <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded font-semibold transition">
                Zkusit nový test
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-4">
        Založeno na Oficiálních pravidlech IIHF a IIHF Situation Book.
    </footer>

    <script>
        let rawData = [];
        let activeQuestions = [];
        let currentIndex = 0;
        let userAnswers = {};

        // Načtení externího JSON souboru
        async function initQuiz() {
            try {
                const res = await fetch('questions.json');
                rawData = await res.json();
            } catch (e) {
                document.getElementById('question-text').textContent = 'Chyba načítání questions.json!';
            }
        }

        // Spuštění vybraného testu
        function startQuiz(count) {
            if (!rawData.length) return;
            const shuffled = [...rawData].sort(() => Math.random() - 0.5);
            activeQuestions = shuffled.slice(0, Math.min(count, shuffled.length));
            
            userAnswers = {};
            currentIndex = 0;

            document.getElementById('menu-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const current = activeQuestions[currentIndex];
            
            document.getElementById('rule-ref').textContent = current.rule || 'Pravidlo --';
            document.getElementById('situation-type').textContent = current.category || '';
            document.getElementById('question-text').textContent = current.question;
            document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${activeQuestions.length}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const isSelected = userAnswers[currentIndex] === idx;
                
                btn.className = `w-full text-left p-3 rounded-lg border transition flex items-center justify-between ${
                    isSelected ? 'bg-blue-600/40 border-blue-400 text-white' : 'border-slate-700 bg-slate-700/50 hover:bg-slate-700'
                }`;
                btn.onclick = () => {
                    userAnswers[currentIndex] = idx;
                    loadQuestion();
                };
                btn.innerHTML = `<span>${opt}</span>`;
                container.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = currentIndex === 0;

            if (currentIndex === activeQuestions.length - 1) {
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('results-card').classList.remove('hidden');

            let score = 0;
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';

            activeQuestions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correctIndex;
                if (isCorrect) score++;

                const reviewBox = document.createElement('div');
                reviewBox.className = `p-3 rounded border text-xs ${isCorrect ? 'bg-green-950/30 border-green-700' : 'bg-red-950/30 border-red-700'}`;
                reviewBox.innerHTML = `
                    <div class="font-bold text-slate-200 mb-1">${idx + 1}. ${q.question}</div>
                    <div class="${isCorrect ? 'text-green-400' : 'text-red-400'}">Vaše odpověď: ${userAnswers[idx] !== undefined ? q.options[userAnswers[idx]] : 'Nezodpovězeno'}</div>
                    ${!isCorrect ? `<div class="text-green-400 mt-0.5">Správná odpověď: ${q.options[q.correctIndex]}</div>` : ''}
                    ${q.explanation ? `<div class="text-slate-400 italic mt-1">${q.explanation}</div>` : ''}
                `;
                reviewList.appendChild(reviewBox);
            });

            const percentage = Math.round((score / activeQuestions.length) * 100);
            document.getElementById('final-score').textContent = `${percentage} %`;
            document.getElementById('final-stats').textContent = `Správně ${score} z ${activeQuestions.length} otázek`;
        }

        initQuiz();
    </script>
</body>
</html>
