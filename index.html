<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIHF Referee Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- Header -->
    <header class="max-w-2xl w-full mx-auto flex justify-between items-center py-4 border-b border-slate-700">
        <h1 class="text-xl font-bold tracking-wide text-blue-400">IIHF Arbitro Rules</h1>
        <div id="score-tracker" class="text-sm font-semibold bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
            Skóre: <span id="score" class="text-green-400">0</span> / <span id="total">0</span>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-2xl w-full mx-auto my-auto bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
        
        <!-- Question Meta -->
        <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
            <span id="rule-ref" class="font-mono bg-slate-700 px-2 py-0.5 rounded text-blue-300">Pravidlo --</span>
            <span id="situation-type" class="uppercase tracking-wider">Kategorie</span>
        </div>

        <!-- Question Text -->
        <h2 id="question-text" class="text-lg font-medium text-slate-100 mb-6 leading-relaxed">
            Načítání otázek...
        </h2>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3">
            <!-- Dynamicky vkládané odpovědi -->
        </div>

        <!-- Explanation Card (Hidden by default) -->
        <div id="explanation-card" class="mt-6 p-4 bg-slate-900 rounded-lg border border-slate-700 hidden">
            <h3 class="font-bold text-sm text-slate-300 mb-1">Správná odpověď & Odůvodnění:</h3>
            <p id="explanation-text" class="text-sm text-slate-400 leading-relaxed"></p>
            <button id="next-btn" onclick="nextQuestion()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg transition">
                Další otázka &rarr;
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-4">
        Založeno na Oficiálních pravidlech IIHF a IIHF Situation Book.
    </footer>

    <!-- Logic Script -->
    <script>
        let quizData = [];
        let currentIndex = 0;
        let score = 0;

        // Načtení dat z externího JSON souboru
        async function initQuiz() {
            try {
                const response = await fetch('questions.json');
                const data = await response.json();
                
                // Náhodné promíchání otázek při každém načtení
                quizData = data.sort(() => Math.random() - 0.5);
                loadQuestion();
            } catch (error) {
                document.getElementById('question-text').textContent = 'Chyba při načítání databáze. Ujistěte se, že soubor questions.json existuje a je správně naformátován.';
                console.error(error);
            }
        }

        function loadQuestion() {
            if (quizData.length === 0) return;

            const current = quizData[currentIndex];
            document.getElementById('rule-ref').textContent = current.rule;
            document.getElementById('situation-type').textContent = current.category;
            document.getElementById('question-text').textContent = current.question;
            document.getElementById('explanation-card').classList.add('hidden');
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-lg border border-slate-700 bg-slate-700/50 hover:bg-slate-700 transition flex items-center justify-between group";
                btn.onclick = () => selectOption(idx);
                btn.innerHTML = `<span>${opt}</span>`;
                container.appendChild(btn);
            });

            document.getElementById('total').textContent = quizData.length;
            document.getElementById('score').textContent = score;
        }

        function selectOption(selectedIndex) {
            const current = quizData[currentIndex];
            const buttons = document.getElementById('options-container').children;

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === current.correctIndex) {
                    buttons[i].classList.add('bg-green-600/30', 'border-green-500', 'text-green-200');
                } else if (i === selectedIndex) {
                    buttons[i].classList.add('bg-red-600/30', 'border-red-500', 'text-red-200');
                }
            }

            if (selectedIndex === current.correctIndex) {
                score++;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('explanation-text').textContent = current.explanation;
            document.getElementById('explanation-card').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex = (currentIndex + 1) % quizData.length;
            loadQuestion();
        }

        // Start aplikace
        initQuiz();
    </script>
</body>
</html>
